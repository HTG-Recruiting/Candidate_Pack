<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#140B30" />
  <title>Candidate pack · HomeToGo Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --purple: #4D21B7;
      --violet: #7C3AED;
      --indigo: #1E1B4B;
      --indigo-2: #2B2468;
      --lavender: #EDE9FE;
      --lavender-2: #F5F2FE;
      --paper: #FBF9FE;
      --ink: #1E1B4B;
      --muted: #555170;
      --muted-dark: #CFC9F2;
      --coral: #FF795B;
      --coral-soft: #FFB09E;
      --gradient: linear-gradient(120deg, #4D21B7 0%, #7A37A4 55%, #FF795B 100%);
      --stage: #120F33;
      --head: "Plus Jakarta Sans", "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      --flip-ms: 900ms;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      font-family: var(--body);
      color: var(--paper);
      background: radial-gradient(110% 70% at 50% 0%, #3B1F8F 0%, var(--stage) 65%);
      -webkit-font-smoothing: antialiased;
    }
    body.is-picker { height: auto; min-height: 100svh; overflow: auto; display: block; }

    #app { display: contents; }
    a { color: inherit; }
    button { font-family: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    /* ---------- Top bar and controls ---------- */

    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      font-size: 13px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .muted { opacity: .75; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .counter { font-variant-numeric: tabular-nums; opacity: .8; }
    .switch {
      font-size: 12px; color: var(--paper); cursor: pointer;
      background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px; padding: 5px 11px;
    }
    .switch:hover { background: rgba(255, 255, 255, .18); }

    .controls {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 4px 16px max(14px, env(safe-area-inset-bottom));
    }
    .nav {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, .1); color: var(--paper);
      border: 1px solid rgba(255, 255, 255, .22); cursor: pointer; transition: background .2s;
    }
    .nav:hover:not(:disabled) { background: rgba(255, 255, 255, .2); }
    .nav:disabled { opacity: .3; cursor: default; }
    .nav .icon { width: 22px; height: 22px; }
    .dots { display: flex; flex-wrap: wrap; justify-content: center; }
    .dot {
      width: 20px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer;
      display: grid; place-items: center; transition: width .25s;
    }
    .dot::before {
      content: ""; display: block; width: 8px; height: 8px; border-radius: 4px;
      background: rgba(255, 255, 255, .35); transition: width .25s, background .25s;
    }
    .dot.on { width: 36px; }
    .dot.on::before { width: 24px; background: var(--gradient); }

    /* ---------- The 3D Book ---------- */

    .stage { display: grid; place-items: center; padding: 14px 16px 6px; min-height: 0; }
    .book { position: relative; z-index: 0; --s: 1; }

    .book::before, .book::after { content: ""; position: absolute; pointer-events: none; }
    .book::before {
      inset: -8px -11px -8px -6px; z-index: -2; border-radius: 6px 14px 14px 6px;
      background: linear-gradient(90deg, #160F45 0, #3A1C99 10px, #34198A 100%);
      box-shadow: 0 34px 60px -20px rgba(0, 0, 0, .7);
    }
    .book::after {
      top: 3px; bottom: 3px; right: -6px; width: 8px; z-index: -1; border-radius: 0 5px 5px 0;
      background: repeating-linear-gradient(to right, #F7F4FE 0 1px, #CDC4EA 1px 2px);
    }

    .pages { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 0% 50%; }

    .page {
      position: absolute; inset: 0; z-index: var(--z);
      transform-origin: 0 50%; transform-style: preserve-3d;
      transition: transform var(--flip-ms) cubic-bezier(.45, .05, .2, 1);
    }
    .page.flipped { transform: rotateY(-180deg); }
    .page.gone { visibility: hidden; }
    .no-anim, .no-anim * { transition: none !important; }

    .face {
      position: absolute; inset: 0; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      box-shadow: 0 1px 2px rgba(20, 11, 48, .18);
    }
    .front { background: var(--paper); }
    .front::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 7%; z-index: 5; pointer-events: none;
      background: linear-gradient(to right, rgba(20, 11, 48, .26), rgba(20, 11, 48, .07) 45%, rgba(20, 11, 48, 0));
    }
    .front::after {
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: linear-gradient(to right, rgba(20, 11, 48, 0) 30%, rgba(20, 11, 48, .45));
      opacity: 0; transition: opacity var(--flip-ms);
    }
    .page.flipped .front::after { opacity: 1; }
    .back { transform: rotateY(180deg); background: linear-gradient(to left, #F1EDFC, #D8CFF0); }

    .canvas {
      position: absolute; left: 0; top: 0; width: 360px; height: 640px;
      transform: scale(var(--s)); transform-origin: 0 0;
    }

    /* ---------- Page Base ---------- */

    .pg {
      position: absolute; inset: 0; overflow: hidden;
      padding: 24px 22px 38px 24px;
      display: flex; flex-direction: column; gap: 12px;
      font-family: var(--body); color: var(--ink);
    }
    .tone-light { background: var(--paper); }
    .tone-lav { background: var(--lavender-2); }
    .tone-dark { background: var(--indigo); color: #fff; }

    .pg p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    .tone-dark p { color: var(--muted-dark); }
    .pg h1, .pg h2, .pg h3 { margin: 0; font-family: var(--head); color: var(--ink); text-wrap: balance; }
    .pg h1 { font-size: 31px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; color: #fff; }
    .pg h2 { font-size: 22px; line-height: 1.15; font-weight: 800; letter-spacing: -.015em; }
    .pg h3 { font-size: 13.5px; line-height: 1.25; font-weight: 700; }
    .tone-dark h2, .tone-dark h3, .card.dark h3 { color: #fff; }

    .eyebrow {
      margin: 0 0 6px !important; font-family: var(--head); font-size: 9.5px !important; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase; color: var(--purple) !important;
    }
    .eyebrow.on-dark { color: var(--coral-soft) !important; }
    .label {
      margin: 0 0 3px !important; font-family: var(--head); font-size: 9px !important; font-weight: 800;
      letter-spacing: .13em; text-transform: uppercase; color: var(--purple) !important;
    }
    .card.dark .label, .tone-dark .label { color: var(--coral-soft) !important; }

    .pg-head { position: relative; padding-right: 56px; }
    .head-deco { position: absolute; right: 0; top: -2px; }

    .folio {
      position: absolute; left: 24px; right: 22px; bottom: 13px;
      display: flex; justify-content: space-between;
      font-size: 9.5px; letter-spacing: .04em; color: #8A84A8;
    }
    .folio span:last-child { font-weight: 700; color: var(--purple); }

    .icon { width: 1em; height: 1em; flex: none; }

    /* Glossy 3D Vector Badges */
    .i3d-badge {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none;
      box-shadow: 0 8px 16px -6px rgba(30, 27, 75, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }
    .i3d-badge svg { width: 20px; height: 20px; }
    .b-purple { background: linear-gradient(135deg, #7C3AED, #4D21B7); }
    .b-coral { background: linear-gradient(135deg, #FF9A85, #FF5A5F); }
    .b-blue { background: linear-gradient(135deg, #38BDF8, #005596); }
    .b-teal { background: linear-gradient(135deg, #2DD4BF, #00877A); }
    .b-amber { background: linear-gradient(135deg, #FBBF24, #EA580C); }

    .pill {
      align-self: flex-start; display: inline-block; margin: 0;
      background: var(--coral); color: var(--indigo) !important;
      padding: 6px 13px; border-radius: 999px; font-weight: 700; font-size: 12px !important;
    }
    .small-pill { padding: 3px 10px; font-size: 10px !important; margin-bottom: 6px; }
    .grad-bar { display: block; width: 72px; height: 5px; border-radius: 3px; background: var(--gradient); }

    .card { position: relative; border-radius: 16px; padding: 14px 16px; background: #fff; box-shadow: 0 1px 0 rgba(77, 33, 183, .06), 0 6px 16px -10px rgba(30, 27, 75, .25); }
    .card.dark { background: var(--indigo); box-shadow: none; }
    .card.dark p { color: var(--muted-dark); }
    .card-deco { position: absolute; right: 12px; top: -12px; }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .chip {
      font-size: 10.5px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 999px;
      background: var(--lavender); color: var(--purple);
    }
    .chip.on-dark { background: rgba(255, 255, 255, .12); color: #fff; }

    .facts { display: grid; grid-template-columns: 84px 1fr; gap: 5px 10px; margin: 8px 0 0; font-size: 12px; line-height: 1.35; }
    .facts dt { font-weight: 700; color: var(--ink); }
    .facts dd { margin: 0; color: var(--muted); }
    .facts.on-dark dt { color: #fff; }
    .facts.on-dark dd { color: var(--muted-dark); }

    .note { font-size: 10.5px !important; }

    /* ---------- Page 1: Cover ---------- */
    .p-0, .p-last { padding: 0; }
    .cover-img, .close-img { position: absolute; left: 0; top: 0; width: 100%; height: 370px; object-fit: cover; }
    .close-img { height: 250px; }
    .cover-shade {
      position: absolute; left: 0; right: 0; top: 180px; height: 192px;
      background: linear-gradient(to bottom, rgba(30, 27, 75, 0), var(--indigo));
    }
    .close-shade { top: 120px; height: 132px; }
    .logo-white { position: absolute; left: 24px; top: 22px; filter: drop-shadow(0 1px 6px rgba(0, 0, 0, .35)); }
    .cover-body {
      position: absolute; left: 24px; right: 22px; top: 318px; bottom: 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .cover-body .lead { font-size: 13.5px; color: var(--muted-dark); }
    .cover-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .hint { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-dark); }

    /* ---------- Page 2: Welcome ---------- */
    .p-1 { padding-top: 0; }
    .band { margin: 0 -22px 0 -24px; width: calc(100% + 46px); height: 200px; object-fit: cover; flex: none; }
    .welcome-body { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
    .signature { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .signature b { display: block; font-family: var(--head); font-size: 13px; color: var(--ink); }
    .signature small { font-size: 10.5px; color: var(--muted); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: var(--gradient); color: #fff;
    }
    .welcome-deco { position: absolute; right: 18px; bottom: 38px; }

    /* ---------- Page 3: Group ---------- */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { border-radius: 14px; padding: 10px 12px; color: #fff; background: linear-gradient(135deg, #4D21B7, #7C3AED); }
    .stat.s3 { background: var(--gradient); }
    .stat b { display: block; font-family: var(--head); font-size: 22px; line-height: 1.05; font-weight: 800; }
    .stat span { display: block; font-size: 10.5px; line-height: 1.3; opacity: .9; margin-top: 2px; }
    .biz-list { display: flex; flex-direction: column; gap: 9px; }
    .biz { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
    .biz p:not(.label) { font-size: 11.5px; line-height: 1.38; }
    .timeline {
      list-style: none; margin: auto 0 0; padding: 0;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; position: relative;
    }
    .timeline::before { content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 2px; background: var(--lavender); }
    .timeline li { position: relative; padding-top: 14px; }
    .timeline li::before { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--purple); }
    .timeline li:last-child::before { background: var(--coral); }
    .timeline b { display: block; font-family: var(--head); font-size: 11px; color: var(--purple); }
    .timeline span { display: block; font-size: 9.5px; line-height: 1.25; color: var(--muted); }

    /* ---------- Page 4: Brands ---------- */
    .travel { padding-right: 64px; }
    .travel p:last-child { font-size: 11.5px; }
    .bgroups { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
    .bgroup { border-top: 1px solid var(--lavender); padding-top: 8px; }
    .bgroup h3 { font-size: 12px; color: var(--purple); }
    .bgroup .chips { margin: 5px 0 4px; }
    .bgroup p { font-size: 10.5px !important; line-height: 1.35 !important; }
    .more-line { display: flex; align-items: center; gap: 6px; margin-top: 10px !important; font-size: 11px !important; font-weight: 600; color: var(--purple) !important; }

    /* ---------- Page 5: Originals ---------- */
    .orig { padding: 12px 14px; }
    .orig-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .orig h3 { font-size: 15px; }
    .since { font-size: 10.5px !important; }
    .orig-facts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .orig-facts li {
      background: var(--lavender-2); border-radius: 10px; padding: 7px 8px;
      font-family: var(--head); font-weight: 700; font-size: 10.5px; line-height: 1.25; color: var(--purple);
    }
    .works { padding-right: 64px; }
    .works p:not(.label) { font-size: 11.5px; }

    /* ---------- Page 6: Team ---------- */
    .team-photo { width: 100%; height: 96px; object-fit: cover; border-radius: 14px; flex: none; }
    .company { padding-top: 16px; }
    .company p:not(.label) { font-size: 11.5px; }
    .logo-tile {
      position: absolute; right: 14px; top: 14px; border-radius: 10px; background: #fff;
      padding: 6px 10px; display: grid; place-items: center;
    }
    .company h3 { padding-right: 95px; }

    /* ---------- Page 7: Principles ---------- */
    .lp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .lp-list li {
      display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center;
      background: #fff; border-radius: 12px; padding: 6px 10px 6px 8px;
    }
    .lp-list .i3d-badge { width: 32px; height: 32px; border-radius: 9px; }
    .lp-list .i3d-badge svg { width: 16px; height: 16px; }
    .lp-list h3 { font-size: 12.5px; }
    .lp-list p { font-size: 11px !important; line-height: 1.3 !important; }
    .p-6 .note { margin-top: auto; }

    /* ---------- Page 8: Process ---------- */
    .next { padding-right: 16px; }
    .next .facts { grid-template-columns: 56px 1fr; font-size: 11.5px; }
    .adjust { margin-top: 8px !important; font-size: 10.5px !important; color: var(--coral-soft) !important; line-height: 1.35 !important; }
    .steps { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .step { display: flex; gap: 10px; align-items: center; }
    .step b { display: block; font-family: var(--head); font-size: 12px; color: var(--ink); }
    .step div > span { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.3; }
    .marker {
      flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--head); font-weight: 800; font-size: 11px;
      border: 2px solid var(--purple); color: var(--purple); background: #fff;
    }
    .step.done .marker { background: var(--purple); color: #fff; }
    .step.now .marker { background: var(--coral); border-color: var(--coral); color: var(--indigo); }

    /* ---------- Page 9: Prepare ---------- */
    .tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .tips li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; background: #fff; border-radius: 14px; padding: 11px 12px 11px 10px; }
    .num {
      font-family: var(--head); font-weight: 800; font-size: 20px; line-height: 1;
      background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tips h3 { margin-bottom: 3px; }
    .tips p { font-size: 11.5px !important; line-height: 1.38 !important; }
    .callout { margin-top: auto; }
    .callout p:not(.label) { color: #fff !important; font-size: 12px; }

    /* ---------- Page 10: Offer ---------- */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .tile { background: var(--lavender-2); border-radius: 13px; padding: 10px 10px 11px; }
    .tile-ico {
      width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 6px;
      background: var(--lavender); color: var(--purple);
    }
    .tile-ico.warm { background: #FFE6DF; color: #D24F33; }
    .tile h3 { font-size: 12px; margin-bottom: 2px; }
    .tile p { font-size: 10.5px !important; line-height: 1.33 !important; }
    .p-9 .note { margin-top: auto; }

    /* ---------- Page 11: Close ---------- */
    .close-body {
      position: absolute; left: 24px; right: 22px; top: 214px; bottom: 22px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .close-body h2 { font-size: 23px; color: #fff; }
    .contact-card { background: var(--indigo-2); box-shadow: none; }
    .contact-card h3 { color: #fff; margin-bottom: 6px; }
    .contact-card p { font-size: 11.5px; }
    .contact { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px !important; font-size: 13px !important; color: #fff !important; }
    .close-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }

    /* ---------- All Companies Picker ---------- */
    .picker {
      width: min(920px, 100%); margin: 0 auto;
      padding: 40px max(20px, env(safe-area-inset-right)) 56px max(20px, env(safe-area-inset-left));
    }
    .picker h1 { font-family: var(--head); font-weight: 800; font-size: clamp(30px, 6vw, 48px); line-height: 1.05; margin: 0 0 12px; }
    .picker p { font-size: 16px; color: var(--muted-dark); margin: 0 0 8px; }
    .pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 28px 0; }
    .pick {
      display: block; width: 100%; padding: 0; text-align: left; cursor: pointer; color: inherit;
      background: var(--indigo-2); border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14); transition: transform .2s, border-color .2s;
    }
    .pick:hover { transform: translateY(-4px); border-color: var(--coral); }
    .pick img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .pick-body { padding: 16px; }
    .pick-body span { display: block; font-family: var(--head); font-weight: 800; font-size: 20px; margin-bottom: 4px; }
    .pick-body small { display: block; font-size: 13px; color: var(--muted-dark); }

    @media (max-width: 600px) {
      .topbar { font-size: 12px; }
      .stage { padding: 10px 12px 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page { transition: opacity .3s ease; }
      .page.flipped { transform: none; opacity: 0; }
      .front::after { display: none; }
    }
    @media print {
      @page { size: 360px 640px; margin: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto; overflow: visible; display: block; background: #fff; }
      .topbar, .controls, .hint { display: none !important; }
      .stage { display: block; padding: 0; }
      .book { width: 360px !important; height: auto !important; --s: 1 !important; }
      .book::before, .book::after { display: none; }
      .pages { position: static; perspective: none; }
      .page {
        position: relative; inset: auto; width: 360px; height: 640px;
        transform: none !important; visibility: visible !important; opacity: 1 !important;
        break-after: page; page-break-after: always;
      }
      .page:last-child { break-after: auto; page-break-after: auto; }
      .face { box-shadow: none; border-radius: 0; }
      .back, .front::after, .front::before { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>

          <footer class="folio"><span>HomeToGo Group · ${c.name}</span><span>9</span></footer>
        </div>`,

        // 10 Offer
        `<div class="pg tone-light p-9">
          <header class="pg-head">
            <span class="i3d-badge b-teal head-deco">${ICONS.plant}</span>
            <p class="eyebrow">What we offer · ${c.name}</p>
            <h2>${c.offerTitle}</h2>
          </header>
          <div class="tiles">
            ${c.tiles.map(t => `
              <div class="tile">
                <span class="tile-ico ${t.warm ? "warm" : ""}">✦</span>
                <h3>${t.h}</h3>
                <p>${t.p}</p>
              </div>
            `).join("")}
          </div>
          <p class="note">Plus dog-friendly offices and travel discounts. Some benefits depend on role and contract.</p>
          <footer class="folio"><span>HomeToGo Group · ${c.name}</span><span>10</span></footer>
        </div>`,

        // 11 Close
        `<div class="pg tone-dark p-0 p-last">
          <img class="close-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="" />
          <div class="cover-shade close-shade"></div>
          <div class="close-body">
            <p class="eyebrow on-dark">Before you go</p>
            <h2>Good luck. We’re looking forward to meeting you.</h2>
            <section class="card contact-card">
              <h3>Questions before your interview?</h3>
              <p class="contact"><b>Reply to your recruiter’s last email.</b></p>
              <p>Nothing is too small to ask: logistics, the format, or who you’ll meet.</p>
            </section>
            <div class="close-foot">
              <div>${logoWhite}</div>
              <span class="grad-bar"></span>
            </div>
          </div>
        </div>`
      ];
    }

    function renderBook(key) {
      const c = COMPANIES[key] || COMPANIES.hometogo;
      document.body.classList.remove("is-picker");
      document.title = `Candidate pack · ${c.name}`;
      const pagesHtml = buildPages(c, key);
      const total = pagesHtml.length;

      app.innerHTML = `
        <header class="topbar">
          <span class="brand">${LOGOS[key].white}<span class="muted">${c.name}</span></span>
          <span class="topbar-right">
            <button class="switch" type="button" id="switchBtn">All companies</button>
            <span class="counter" id="counter">1 / ${total}</span>
          </span>
        </header>
        <main class="stage" id="stage">
          <div class="book" id="book" aria-roledescription="book">
            <div class="pages" id="pages">
              ${pagesHtml.map((html, i) => `
                <section class="page" data-index="${i}" style="--z: ${total - i};">
                  <div class="face front"><div class="canvas">${html}</div></div>
                  <div class="face back" aria-hidden="true"></div>
                </section>
              `).join("")}
            </div>
          </div>
        </main>
        <nav class="controls" aria-label="Pages">
          <button class="nav" type="button" id="prev" aria-label="Previous page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <div class="dots" id="dots">
            ${pagesHtml.map((_, i) => `<button class="dot" type="button" data-go="${i}" aria-label="Page ${i + 1}"></button>`).join("")}
          </div>
          <button class="nav" type="button" id="next" aria-label="Next page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </nav>
      `;

      pageEls = Array.from(document.querySelectorAll(".page"));
      current = 0;

      function fit() {
        const stage = document.getElementById("stage");
        const book = document.getElementById("book");
        if (!stage || !book) return;
        const rect = stage.getBoundingClientRect();
        const availW = Math.max(240, rect.width - 40);
        const availH = Math.max(320, rect.height - 28);
        const s = Math.min(availW / 360, availH / 640);
        book.style.width = `${Math.round(360 * s)}px`;
        book.style.height = `${Math.round(640 * s)}px`;
        book.style.setProperty("--s", s);
      }

      function update(instant = false) {
        if (instant) document.body.classList.add("no-anim");
        pageEls.forEach((p, i) => {
          p.classList.toggle("flipped", i < current);
          p.classList.toggle("gone", i < current - 1);
          p.style.zIndex = i < current ? i + 1 : total - i;
        });
        document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i === current));
        document.getElementById("counter").textContent = `${current + 1} / ${total}`;
        document.getElementById("prev").disabled = current === 0;
        document.getElementById("next").disabled = current === total - 1;
        if (instant) {
          requestAnimationFrame(() => document.body.classList.remove("no-anim"));
        }
      }

      function goTo(idx) {
        current = Math.max(0, Math.min(total - 1, idx));
        update(false);
      }

      document.getElementById("switchBtn").onclick = () => {
        history.replaceState(null, "", window.location.pathname);
        renderPicker();
      };
      document.getElementById("prev").onclick = () => goTo(current - 1);
      document.getElementById("next").onclick = () => goTo(current + 1);
      document.querySelectorAll(".dot").forEach(d => {
        d.onclick = () => goTo(Number(d.dataset.go));
      });

      // Swipe support on the book
      let startX = 0;
      const bookEl = document.getElementById("book");
      bookEl.addEventListener("touchstart", e => { startX = e.changedTouches[0].screenX; }, { passive: true });
      bookEl.addEventListener("touchend", e => {
        const dx = startX - e.changedTouches[0].screenX;
        if (Math.abs(dx) > 40) goTo(current + (dx > 0 ? 1 : -1));
      }, { passive: true });

      window.onresize = fit;
      fit();
      update(true);
    }

    document.addEventListener("keydown", e => {
      if (!pageEls.length || document.body.classList.contains("is-picker")) return;
      if (e.key === "ArrowRight") { current = Math.min(pageEls.length - 1, current + 1); document.getElementById("next")?.click(); }
      if (e.key === "ArrowLeft") { current = Math.max(0, current - 1); document.getElementById("prev")?.click(); }
    });

    // Boot: supports #hometogo, #interhome, #smoobu, ?e=..., or opens All Companies Picker
    const params = new URLSearchParams(window.location.search);
    const paramKey = (params.get("e") || window.location.hash.replace("#", "")).toLowerCase();
    if (COMPANIES[paramKey]) {
      renderBook(paramKey);
    } else {
      renderPicker();
    }
  </script>
</body>
</html>
