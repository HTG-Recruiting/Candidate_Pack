<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2B0C75" />
  <title>Candidate pack · HomeToGo Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      /* Official HomeToGo Brand Guidelines */
      --purple: #4D21B7;
      --violet: #805AE9;
      --indigo: #2B0C75;
      --indigo-2: #3A168E;
      --lavender: #EDEDFF;
      --lavender-2: #F6F5FF;
      --paper: #FFFFFF;
      --ink: #262626;
      --muted: #434343;
      --muted-dark: #DFDCFF;
      --coral: #FF7E64;
      --coral-soft: #FFB2A2;
      --pro-mint: #84FCA3;
      --accent-blue: #3290FF;
      --gradient: linear-gradient(120deg, #4D21B7 0%, #805AE9 55%, #FF7E64 100%);
      --stage: #1A074A;
      --head: "Poppins", system-ui, -apple-system, sans-serif;
      --body: "Poppins", system-ui, -apple-system, sans-serif;
      --flip-ms: 900ms;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      font-family: var(--body);
      color: var(--paper);
      background: radial-gradient(110% 70% at 50% 0%, #4D21B7 0%, var(--stage) 68%);
      -webkit-font-smoothing: antialiased;
    }
    body.is-picker { height: auto; min-height: 100svh; overflow: auto; display: block; }

    #app { display: contents; }
    a { color: inherit; }
    button { font-family: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    /* ---------- Top bar and controls ---------- */

    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      font-size: 13px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .muted { opacity: .8; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .counter { font-variant-numeric: tabular-nums; opacity: .85; }
    .switch {
      font-size: 12px; color: var(--paper); cursor: pointer; font-weight: 500;
      background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 999px; padding: 5px 12px;
    }
    .switch:hover { background: rgba(255, 255, 255, .2); }

    .controls {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 4px 16px max(14px, env(safe-area-inset-bottom));
    }
    .nav {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, .12); color: var(--paper);
      border: 1px solid rgba(255, 255, 255, .24); cursor: pointer; transition: background .2s;
    }
    .nav:hover:not(:disabled) { background: rgba(255, 255, 255, .22); }
    .nav:disabled { opacity: .3; cursor: default; }
    .nav .icon { width: 22px; height: 22px; }
    .dots { display: flex; flex-wrap: wrap; justify-content: center; }
    .dot {
      width: 20px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer;
      display: grid; place-items: center; transition: width .25s;
    }
    .dot::before {
      content: ""; display: block; width: 8px; height: 8px; border-radius: 4px;
      background: rgba(255, 255, 255, .35); transition: width .25s, background .25s;
    }
    .dot.on { width: 36px; }
    .dot.on::before { width: 24px; background: var(--gradient); }

    /* ---------- The 3D Book ---------- */

    .stage { display: grid; place-items: center; padding: 14px 16px 6px; min-height: 0; }
    .book { position: relative; z-index: 0; --s: 1; }

    .book::before, .book::after { content: ""; position: absolute; pointer-events: none; }
    .book::before {
      inset: -8px -11px -8px -6px; z-index: -2; border-radius: 6px 14px 14px 6px;
      background: linear-gradient(90deg, #1E0757 0, #4D21B7 10px, #3A168E 100%);
      box-shadow: 0 34px 60px -20px rgba(0, 0, 0, .72);
    }
    .book::after {
      top: 3px; bottom: 3px; right: -6px; width: 8px; z-index: -1; border-radius: 0 5px 5px 0;
      background: repeating-linear-gradient(to right, #FFFFFF 0 1px, #EDEDFF 1px 2px);
    }

    .pages { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 0% 50%; }

    .page {
      position: absolute; inset: 0; z-index: var(--z);
      transform-origin: 0 50%; transform-style: preserve-3d;
      transition: transform var(--flip-ms) cubic-bezier(.45, .05, .2, 1);
    }
    .page.flipped { transform: rotateY(-180deg); }
    .page.gone { visibility: hidden; }
    .no-anim, .no-anim * { transition: none !important; }

    .face {
      position: absolute; inset: 0; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      box-shadow: 0 1px 2px rgba(43, 12, 117, .18);
    }
    .front { background: var(--paper); }
    .front::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 7%; z-index: 5; pointer-events: none;
      background: linear-gradient(to right, rgba(43, 12, 117, .24), rgba(43, 12, 117, .06) 45%, rgba(43, 12, 117, 0));
    }
    .front::after {
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: linear-gradient(to right, rgba(43, 12, 117, 0) 30%, rgba(43, 12, 117, .45));
      opacity: 0; transition: opacity var(--flip-ms);
    }
    .page.flipped .front::after { opacity: 1; }
    .back { transform: rotateY(180deg); background: linear-gradient(to left, #F6F5FF, #EDEDFF); }

    .canvas {
      position: absolute; left: 0; top: 0; width: 360px; height: 640px;
      transform: scale(var(--s)); transform-origin: 0 0;
    }

    /* ---------- Page Base ---------- */

    .pg {
      position: absolute; inset: 0; overflow: hidden;
      padding: 24px 22px 38px 24px;
      display: flex; flex-direction: column; gap: 11px;
      font-family: var(--body); color: var(--ink);
    }
    .tone-light { background: var(--paper); }
    .tone-lav { background: var(--lavender); }
    .tone-dark { background: var(--indigo); color: #fff; }

    .pg p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
    .tone-dark p { color: var(--muted-dark); }
    .pg h1, .pg h2, .pg h3 { margin: 0; font-family: var(--head); color: var(--ink); text-wrap: balance; }
    .pg h1 { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; color: #fff; }
    .pg h2 { font-size: 21px; line-height: 1.18; font-weight: 700; letter-spacing: -.015em; }
    .pg h3 { font-size: 13px; line-height: 1.25; font-weight: 600; }
    .tone-dark h2, .tone-dark h3, .card.dark h3 { color: #fff; }

    .eyebrow {
      margin: 0 0 5px !important; font-family: var(--head); font-size: 9.5px !important; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--purple) !important;
    }
    .eyebrow.on-dark { color: var(--coral) !important; }
    .label {
      margin: 0 0 3px !important; font-family: var(--head); font-size: 9px !important; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: var(--purple) !important;
    }
    .card.dark .label, .tone-dark .label { color: var(--coral) !important; }
    .card.dark .label.pro { color: var(--pro-mint) !important; }

    .pg-head { position: relative; padding-right: 64px; }
    .head-deco { position: absolute; right: -4px; top: -6px; width: 58px; height: 58px; }

    .folio {
      position: absolute; left: 24px; right: 22px; bottom: 13px;
      display: flex; justify-content: space-between;
      font-size: 9.5px; letter-spacing: .04em; color: #757096;
    }
    .folio span:last-child { font-weight: 700; color: var(--purple); }

    /* 3D Render Styling */
    .i3d {
      display: block;
      filter: drop-shadow(0 8px 12px rgba(43, 12, 117, 0.25));
    }
    .i3d svg { width: 100%; height: 100%; display: block; }
    .icon { width: 1em; height: 1em; flex: none; }

    .pill {
      align-self: flex-start; display: inline-block; margin: 0;
      background: var(--coral); color: #fff !important;
      padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: 11.5px !important;
    }
    .small-pill { padding: 3px 10px; font-size: 10px !important; margin-bottom: 6px; }
    .grad-bar { display: block; width: 72px; height: 5px; border-radius: 3px; background: var(--gradient); }

    .card { position: relative; border-radius: 16px; padding: 13px 15px; background: #fff; box-shadow: 0 2px 14px -4px rgba(43, 12, 117, .12); border: 1px solid rgba(77, 33, 183, .08); }
    .card.dark { background: var(--indigo); box-shadow: none; border: none; }
    .card.dark p { color: var(--muted-dark); }
    .card-deco { position: absolute; right: 10px; top: -14px; width: 52px; height: 52px; }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .chip {
      font-size: 10px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 999px;
      background: var(--lavender); color: var(--purple);
    }
    .chip.on-dark { background: rgba(255, 255, 255, .14); color: #fff; }
    .chip.pro-chip { background: rgba(132, 252, 163, .18); color: var(--pro-mint); }

    .facts { display: grid; grid-template-columns: 84px 1fr; gap: 5px 10px; margin: 8px 0 0; font-size: 11.5px; line-height: 1.35; }
    .facts dt { font-weight: 600; color: var(--ink); }
    .facts dd { margin: 0; color: var(--muted); }
    .facts.on-dark dt { color: #fff; }
    .facts.on-dark dd { color: var(--muted-dark); }

    .note { font-size: 10px !important; }

    /* ---------- 1 Cover ---------- */
    .p-0, .p-last { padding: 0; }
    .cover-img, .close-img { position: absolute; left: 0; top: 0; width: 100%; height: 370px; object-fit: cover; }
    .close-img { height: 250px; }
    .cover-shade {
      position: absolute; left: 0; right: 0; top: 180px; height: 192px;
      background: linear-gradient(to bottom, rgba(43, 12, 117, 0), var(--indigo));
    }
    .close-shade { top: 120px; height: 132px; }
    .logo-white { position: absolute; left: 24px; top: 22px; height: 30px; width: auto; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .45)); display: flex; align-items: center; }
    .cover-body {
      position: absolute; left: 24px; right: 22px; top: 318px; bottom: 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .cover-body .lead { font-size: 13px; color: var(--muted-dark); }
    .cover-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .hint { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-dark); }

    /* ---------- 2 Welcome ---------- */
    .p-1 { padding-top: 0; }
    .band { margin: 0 -22px 0 -24px; width: calc(100% + 46px); height: 205px; object-fit: cover; flex: none; }
    .welcome-body { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
    .signature { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .signature b { display: block; font-family: var(--head); font-size: 13px; color: var(--ink); }
    .signature small { font-size: 10.5px; color: var(--muted); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: var(--gradient); color: #fff;
    }
    .welcome-deco { position: absolute; right: 16px; bottom: 34px; width: 66px; height: 66px; }

    /* ---------- 3 Group ---------- */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { border-radius: 14px; padding: 10px 12px; color: #fff; background: linear-gradient(135deg, #4D21B7, #805AE9); }
    .stat.s3 { background: var(--gradient); }
    .stat b { display: block; font-family: var(--head); font-size: 21px; line-height: 1.05; font-weight: 700; }
    .stat span { display: block; font-size: 10px; line-height: 1.3; opacity: .92; margin-top: 2px; }
    .biz-list { display: flex; flex-direction: column; gap: 9px; }
    .biz { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
    .biz .i3d { width: 44px; height: 44px; }
    .biz p:not(.label) { font-size: 11px; line-height: 1.38; }
    .timeline {
      list-style: none; margin: auto 0 0; padding: 0;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; position: relative;
    }
    .timeline::before { content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 2px; background: var(--lavender); }
    .timeline li { position: relative; padding-top: 14px; }
    .timeline li::before { content: ""; position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--purple); }
    .timeline li:last-child::before { background: var(--coral); }
    .timeline b { display: block; font-family: var(--head); font-size: 10.5px; color: var(--purple); }
    .timeline span { display: block; font-size: 9px; line-height: 1.25; color: var(--muted); }

    /* ---------- 4 Brands ---------- */
    .travel { padding-right: 70px; }
    .travel p:last-child { font-size: 11px; }
    .bgroups { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .bgroup { border-top: 1px solid var(--lavender); padding-top: 7px; }
    .bgroup h3 { font-size: 11.5px; color: var(--purple); }
    .bgroup .chips { margin: 5px 0 4px; }
    .bgroup p { font-size: 10px !important; line-height: 1.35 !important; }
    .more-line { display: flex; align-items: center; gap: 6px; margin-top: 8px !important; font-size: 10.5px !important; font-weight: 600; color: var(--purple) !important; }

    /* ---------- 5 Originals ---------- */
    .orig { padding: 12px 14px; }
    .orig-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .orig h3 { font-size: 14.5px; }
    .since { font-size: 10px !important; }
    .orig-facts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .orig-facts li {
      background: var(--lavender); border-radius: 10px; padding: 7px 8px;
      font-family: var(--head); font-weight: 600; font-size: 10.5px; line-height: 1.25; color: var(--purple);
    }
    .works { padding-right: 72px; }
    .works .card-deco { top: auto; bottom: 8px; width: 52px; height: 52px; }
    .works p:not(.label) { font-size: 11px; }

    /* ---------- 6 Team ---------- */
    .team-photo { width: 100%; height: 96px; object-fit: cover; border-radius: 14px; flex: none; }
    .company { padding-top: 15px; }
    .company p:not(.label) { font-size: 11px; }
    .logo-tile {
      position: absolute; right: 14px; top: 14px; border-radius: 10px; background: #fff;
      padding: 6px 10px; display: grid; place-items: center;
    }
    .company h3 { padding-right: 110px; }

    /* ---------- 7 Principles ---------- */
    .lp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5.5px; }
    .lp-list li {
      display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center;
      background: #fff; border-radius: 12px; padding: 5px 10px 5px 8px;
    }
    .lp-list .i3d { width: 34px; height: 34px; }
    .lp-list h3 { font-size: 12px; }
    .lp-list p { font-size: 10.5px !important; line-height: 1.28 !important; }
    .p-6 .note { margin-top: auto; }

    /* ---------- 8 Process ---------- */
    .next { padding-right: 16px; }
    .next .card-deco { width: 48px; height: 48px; top: -12px; }
    .next .facts { grid-template-columns: 56px 1fr; font-size: 11px; }
    .adjust { margin-top: 7px !important; font-size: 10px !important; color: var(--coral-soft) !important; line-height: 1.35 !important; }
    .steps { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6.5px; }
    .step { display: flex; gap: 10px; align-items: center; }
    .step b { display: block; font-family: var(--head); font-size: 11.5px; color: var(--ink); }
    .step div > span { display: block; font-size: 10px; color: var(--muted); line-height: 1.3; }
    .marker {
      flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
      font-family: var(--head); font-weight: 700; font-size: 11px;
      border: 2px solid var(--purple); color: var(--purple); background: #fff;
    }
    .step.done .marker { background: var(--purple); color: #fff; }
    .step.now .marker { background: var(--coral); border-color: var(--coral); color: #fff; }

    /* ---------- 9 Prepare ---------- */
    .tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .tips li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; background: #fff; border-radius: 14px; padding: 10px 12px 10px 10px; }
    .num {
      font-family: var(--head); font-weight: 700; font-size: 19px; line-height: 1;
      background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tips h3 { margin-bottom: 2px; }
    .tips p { font-size: 11px !important; line-height: 1.36 !important; }
    .callout { margin-top: auto; }
    .callout p:not(.label) { color: #fff !important; font-size: 11.5px; }

    /* ---------- 10 Offer ---------- */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .tile { background: var(--lavender); border-radius: 13px; padding: 9px 10px 10px; }
    .tile-ico {
      width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 5px;
      background: #fff; color: var(--purple); font-size: 12px;
    }
    .tile-ico.warm { background: #FFE6E0; color: #D24F33; }
    .tile h3 { font-size: 11.5px; margin-bottom: 2px; }
    .tile p { font-size: 10px !important; line-height: 1.32 !important; }
    .p-9 .note { margin-top: auto; }

    /* ---------- 11 Close ---------- */
    .close-body {
      position: absolute; left: 24px; right: 22px; top: 214px; bottom: 22px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .close-body h2 { font-size: 22px; color: #fff; }
    .contact-card { background: var(--indigo-2); box-shadow: none; border: none; }
    .contact-card h3 { color: #fff; margin-bottom: 6px; }
    .contact-card p { font-size: 11px; }
    .contact { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px !important; font-size: 12.5px !important; color: #fff !important; }
    .close-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }

    /* ---------- Picker ---------- */
    .picker {
      width: min(920px, 100%); margin: 0 auto;
      padding: 40px max(20px, env(safe-area-inset-right)) 56px max(20px, env(safe-area-inset-left));
    }
    .picker h1 { font-family: var(--head); font-weight: 700; font-size: clamp(28px, 6vw, 44px); line-height: 1.08; margin: 0 0 12px; }
    .picker p { font-size: 15px; color: var(--muted-dark); margin: 0 0 8px; }
    .pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 28px 0; }
    .pick {
      display: block; width: 100%; padding: 0; text-align: left; cursor: pointer; color: inherit;
      background: var(--indigo-2); border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16); transition: transform .2s, border-color .2s;
    }
    .pick:hover { transform: translateY(-4px); border-color: var(--coral); }
    .pick img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .pick-body { padding: 16px; }
    .pick-body span { display: block; font-family: var(--head); font-weight: 700; font-size: 19px; margin-bottom: 4px; }
    .pick-body small { display: block; font-size: 12.5px; color: var(--muted-dark); }

    @media (max-width: 600px) {
      .topbar { font-size: 12px; }
      .stage { padding: 10px 12px 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page { transition: opacity .3s ease; }
      .page.flipped { transform: none; opacity: 0; }
      .front::after { display: none; }
    }
    @media print {
      @page { size: 360px 640px; margin: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { height: auto; overflow: visible; display: block; background: #fff; }
      .topbar, .controls, .hint { display: none !important; }
      .stage { display: block; padding: 0; }
      .book { width: 360px !important; height: auto !important; --s: 1 !important; }
      .book::before, .book::after { display: none; }
      .pages { position: static; perspective: none; }
      .page {
        position: relative; inset: auto; width: 360px; height: 640px;
        transform: none !important; visibility: visible !important; opacity: 1 !important;
        break-after: page; page-break-after: always;
      }
      .page:last-child { break-after: auto; page-break-after: auto; }
      .face { box-shadow: none; border-radius: 0; }
      .back, .front::after, .front::before { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Self-Contained 3D Clay/Isometric SVG Icon Library styled with official HomeToGo Brand Colors
    const ICONS_3D = {

    function renderBook(key) {
      const c = COMPANIES[key] || COMPANIES.hometogo;
      document.body.classList.remove("is-picker");
      document.title = `Candidate pack · ${c.name}`;
      const pagesHtml = buildPages(c, key);
      const total = pagesHtml.length;

      app.innerHTML = `
        <header class="topbar">
          <span class="brand">${LOGOS.hometogo.white}<span class="muted">${c.name}</span></span>
          <span class="topbar-right">
            <button class="switch" type="button" id="switchBtn">All companies</button>
            <span class="counter" id="counter">1 / ${total}</span>
          </span>
        </header>
        <main class="stage" id="stage">
          <div class="book" id="book" aria-roledescription="book">
            <div class="pages" id="pages">
              ${pagesHtml.map((html, i) => `
                <section class="page" data-index="${i}" style="--z: ${total - i};">
                  <div class="face front"><div class="canvas">${html}</div></div>
                  <div class="face back" aria-hidden="true"></div>
                </section>
              `).join("")}
            </div>
          </div>
        </main>
        <nav class="controls" aria-label="Pages">
          <button class="nav" type="button" id="prev" aria-label="Previous page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <div class="dots" id="dots">
            ${pagesHtml.map((_, i) => `<button class="dot" type="button" data-go="${i}" aria-label="Page ${i + 1}"></button>`).join("")}
          </div>
          <button class="nav" type="button" id="next" aria-label="Next page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </nav>
      `;

      pageEls = Array.from(document.querySelectorAll(".page"));
      current = 0;

      function fit() {
        const stage = document.getElementById("stage");
        const book = document.getElementById("book");
        if (!stage || !book) return;
        const rect = stage.getBoundingClientRect();
        const availW = Math.max(240, rect.width - 40);
        const availH = Math.max(320, rect.height - 28);
        const s = Math.min(availW / 360, availH / 640);
        book.style.width = `${Math.round(360 * s)}px`;
        book.style.height = `${Math.round(640 * s)}px`;
        book.style.setProperty("--s", s);
      }

      function update(instant = false) {
        if (instant) document.body.classList.add("no-anim");
        pageEls.forEach((p, i) => {
          p.classList.toggle("flipped", i < current);
          p.classList.toggle("gone", i < current - 1);
          p.style.zIndex = i < current ? i + 1 : total - i;
        });
        document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i === current));
        document.getElementById("counter").textContent = `${current + 1} / ${total}`;
        document.getElementById("prev").disabled = current === 0;
        document.getElementById("next").disabled = current === total - 1;
        if (instant) {
          requestAnimationFrame(() => document.body.classList.remove("no-anim"));
        }
      }

      function goTo(idx) {
        current = Math.max(0, Math.min(total - 1, idx));
        update(false);
      }

      document.getElementById("switchBtn").onclick = () => {
        history.replaceState(null, "", window.location.pathname);
        renderPicker();
      };
      document.getElementById("prev").onclick = () => goTo(current - 1);
      document.getElementById("next").onclick = () => goTo(current + 1);
      document.querySelectorAll(".dot").forEach(d => {
        d.onclick = () => goTo(Number(d.dataset.go));
      });

      let startX = 0;
      const bookEl = document.getElementById("book");
      bookEl.addEventListener("touchstart", e => { startX = e.changedTouches[0].screenX; }, { passive: true });
      bookEl.addEventListener("touchend", e => {
        const dx = startX - e.changedTouches[0].screenX;
        if (Math.abs(dx) > 40) goTo(current + (dx > 0 ? 1 : -1));
      }, { passive: true });

      window.onresize = fit;
      fit();
      update(true);
    }

    document.addEventListener("keydown", e => {
      if (!pageEls.length || document.body.classList.contains("is-picker")) return;
      if (e.key === "ArrowRight") document.getElementById("next")?.click();
      if (e.key === "ArrowLeft") document.getElementById("prev")?.click();
    });

    const params = new URLSearchParams(window.location.search);
    const paramKey = (params.get("e") || window.location.hash.replace("#", "")).toLowerCase();
    if (COMPANIES[paramKey]) {
      renderBook(paramKey);
    } else {
      renderPicker();
    }
  </script>
